# Sutton Dental & Implant Clinic — Google Ads (/) and Meta Ads (/meta-ads)
# landing pages. Static site, no build step: publish the repo root as-is.
#
# This is a single Netlify site serving both pages, matching the current
# live suttonsmiles.info architecture. No [[plugins]], no [functions] —
# there is no server or build pipeline here, unlike Next.js-based Halo
# sites (see website-alteon-colindale for that shape).

[build]
  publish = "."

# index.html is served at / automatically (Netlify's default document).
# meta-ads.html needs an explicit rewrite to answer at the clean /meta-ads
# path rather than only at /meta-ads.html — Netlify's automatic clean-URL
# behaviour usually does this on its own, but it's a site-wide toggle, not
# something this page's routing should silently depend on. status = 200
# means a rewrite (URL bar stays /meta-ads), not a redirect.
[[redirects]]
  from = "/meta-ads"
  to = "/meta-ads.html"
  status = 200

[[redirects]]
  from = "/meta-ads/"
  to = "/meta-ads.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Caching. Without these Netlify serves every asset as max-age=0 must-revalidate,
# so each repeat visit re-checks all ~20 files. Assets here are content-stable:
# when one changes, ship it under a NEW filename (as puneet-intro-v2.mp4 did)
# rather than overwriting, otherwise cached clients keep the old copy.

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/vid/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The HTML itself must stay revalidated so copy and tracking changes go live
# immediately. must-revalidate + ETag means a repeat visit costs a 304, not 100KB.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No CSP: dc-runtime.js Babel-transpiles the inline component script in the
# browser (needs 'unsafe-eval'), and both pages rely on third-party GTM/Meta
# Pixel/CallRail scripts. Adding a CSP is a larger, separate piece of work —
# see README "Future hardening" — not bundled into this pass.
